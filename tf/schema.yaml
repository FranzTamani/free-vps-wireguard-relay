title: "Oracle Free VPS - WireGuard game relay"
description: "Always Free A1 VPS that relays game traffic over WireGuard to a home server behind CGNAT. Detailed settings live in locals.tf."
schemaVersion: 1.1.0
version: "20261006"
locale: "en"

variableGroups:
  - title: "Hidden (injected by Resource Manager)"
    visible: false
    variables:
      - tenancy_ocid
      - region

  - title: "Placement"
    variables:
      - compartment_ocid

  - title: "Access"
    variables:
      - ssh_public_key

  - title: "Cost & Reclamation Guard"
    variables:
      - budget_alert_email
      - anti_idle_enabled

  - title: "WireGuard"
    variables:
      - home_peer_public_key

variables:
  compartment_ocid:
    type: oci:identity:compartment:id
    title: "Compartment"
    description: "Compartment to deploy the VPS into."
    required: true

  ssh_public_key:
    type: oci:core:ssh:publickey
    title: "SSH public key"
    description: "Key authorised for the non-root admin user (root login is disabled)."
    required: true

  budget_alert_email:
    type: string
    title: "Budget Alert Email"
    description: "Optional email address to receive immediate alerts if actual tenancy spend hits $0.01 (free)."
    required: false

  anti_idle_enabled:
    type: boolean
    title: "Anti-Idle Keepalive"
    description: "Keep CPU and memory >20% to prevent Oracle Always Free instance reclamation (set to false if using Pay-As-You-Go)."
    default: true
    required: false

  home_peer_public_key:
    type: string
    title: "Home Peer Public Key"
    description: "Optional WireGuard public key of your home game server (from home.pub)."
    required: false
